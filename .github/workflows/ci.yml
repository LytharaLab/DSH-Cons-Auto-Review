name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} · DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        dsh: ['0.1.7-rc.2', '0.2.0-rc.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Select the DSH compatibility matrix version
        env:
          DSH_TEST_VERSION: '${{ matrix.dsh }}'
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          const packages = Object.keys(p.devDependencies)
            .filter(name => name.startsWith('@deepseek-ai/dsh-'))
            .map(name => `${name}@${process.env.DSH_TEST_VERSION}`);
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--legacy-peer-deps', ...packages], { stdio: 'inherit' });
          JS
      - run: npm run verify

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Pack and inspect the publishable tarball
        run: |
          npm pack --ignore-scripts --json > pack.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const [entry] = JSON.parse(readFileSync('pack.json', 'utf8'));
          const files = entry.files.map((f) => f.path);
          const required = [
            'package.json',
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
            'cordis.patch.yml',
            'icon.svg',
            'src/index.js',
            'src/index.d.ts',
            'src/permission-presets.js',
            'locale/zh.json',
            'locale/en.json',
            'docs/CONFIGURATION.md',
            'docs/COMPATIBILITY.md',
            'examples/defaults.json',
            'THIRD_PARTY_NOTICES.md',
            'THIRD_PARTY_LICENSE.txt',
          ];
          const missing = required.filter((file) => !files.includes(file));
          if (missing.length) {
            console.error('missing from the tarball:', missing.join(', '));
            process.exit(1);
          }
          const leaked = files.filter(
            (file) => file.startsWith('tests/') || file.startsWith('test-results/') || file.startsWith('.github/'),
          );
          if (leaked.length) {
            console.error('must not be published:', leaked.join(', '));
            process.exit(1);
          }
          console.log(`${entry.filename}: ${files.length} files, ${entry.size} bytes`);
          JS
