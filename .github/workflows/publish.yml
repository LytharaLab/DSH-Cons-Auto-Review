name: Publish to npm

# 打 tag（例如 v1.1.1）时发布；也可以手动触发做一次 dry run。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm Trusted Publishing 与 provenance 所需的 OIDC 令牌

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 不设置 registry-url：避免 setup-node 写入依赖 NODE_AUTH_TOKEN 的 .npmrc，
          # 发布目标由 package.json 的 publishConfig.registry 决定（registry.npmjs.org）。
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { version, name } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (tag !== version) {
            console.error(`${name}: tag v${tag} does not match package.json version ${version}`);
            process.exit(1);
          }
          console.log(`${name}@${version}`);
          JS
      - run: npm run verify
      - name: Publish (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm publish --access public --dry-run
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
